name: CI retarget
on:
  pull_request:
    types: [edited]
permissions:
  actions: write
jobs:
  dispatch:
    if: github.event.changes.base && github.base_ref == 'main' && !github.event.pull_request.head.repo.fork && !startsWith(github.head_ref, 'noretarget/')
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD" -f pr="$PR"
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.head_ref }}
          PR: ${{ github.event.pull_request.number }}
