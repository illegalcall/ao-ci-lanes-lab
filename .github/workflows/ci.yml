name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      pr: { type: number, required: true }
concurrency:
  group: ci-${{ inputs.pr || github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      lanes: ${{ steps.pick.outputs.lanes }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr || github.event.pull_request.number }}
        run: |
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR")
          echo "draft=$(jq -r .draft <<<"$pr") base=$(jq -r .base.ref <<<"$pr")"
          if [ "$(jq -r .draft <<<"$pr")" = true ] || [ "$(jq -r .base.ref <<<"$pr")" != main ]; then echo 'lanes=[]' >> "$GITHUB_OUTPUT"; exit 0; fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename' > changed.txt
          node scripts/ci-lanes.mjs < changed.txt >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
  go:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.lanes), 'go')
    uses: ./.github/workflows/lane.yml
    with: { name: go }
  frontend:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.lanes), 'frontend')
    uses: ./.github/workflows/lane.yml
    with: { name: frontend }
  ci-ok:
    if: always()
    needs: [changes, go, frontend]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -c 'map_values(.result)' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS"
